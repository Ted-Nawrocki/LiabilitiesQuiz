<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Corporate Actions Scenario Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="quiz-container">
    <header>
      <h1>Corporate Actions Scenario Quiz</h1>
      <p id="question-meta"></p>
    </header>

    <!-- Question Section -->
    <section id="question-section">
      <h2 id="question-title"></h2>
      <p id="question-prompt"></p>

      <div id="options-container"></div>

      <div id="feedback" class="feedback"></div>

      <button id="next-button" class="hidden">Next Scenario</button>
    </section>

    <!-- Results Section -->
    <section id="results-section" class="hidden">
      <h2>Quiz Complete</h2>
      <p id="results-summary"></p>
    </section>
  </div>

  <!-- Scripts must load in this order -->
  <script src="questions.js"></script>
  <script src="main.js"></script>
</body>
</html>
